<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>

    <div class="container">

        <div class="display">0</div>
        <div class="miniContainer">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="add" onclick="appendValue('+')">+</button>
            <button class="one" onclick="appendValue('1')">1</button>
            <button class="two" onclick="appendValue('2')">2</button>
            <button class="three" onclick="appendValue('3')">3</button>
            <button class="sub" onclick="appendValue('-')">-</button>
            <button class="four" onclick="appendValue('4')">4</button>
            <button class="five" onclick="appendValue('5')">5</button>
            <button class="six" onclick="appendValue('6')">6</button>
            <button class="multiply" onclick="appendValue('*')">*</button>
            <button class="seven" onclick="appendValue('7')">7</button>
            <button class="eight" onclick="appendValue('8')">8</button>
            <button class="nine" onclick="appendValue('9')">9</button>
            <button class="divide" onclick="appendValue('/')">/</button>
            <button class="zero" onclick="appendValue('0')">0</button>
            <button class="decimal" onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
